
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ağlayan Rakun ve Ağlayan Nör</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#17152e;color:white;
 font-family:Arial;text-align:center;
}
h1{color:#ffe477;font-size:clamp(22px,4vw,36px);padding:8px}
#hud{
 display:flex;justify-content:center;gap:10px;
 flex-wrap:wrap;padding:8px;
}
.info{
 background:#29264c;padding:10px 15px;
 border:2px solid #8277bd;border-radius:12px;
}
#game{
 width: min(960px,98vw);
 margin:auto;
}
canvas{
 width:100%;height:auto;
 display:block;border:5px solid white;
 border-radius:17px;background:#e8c58d;
 touch-action:none;
}
#message{
 min-height:65px;background:#29264c;
 border:2px solid #9385da;
 border-radius:13px;padding:15px;
 margin:12px auto;width:95%;
 font-size:16px;
}
#controls{
 display:flex;justify-content:center;
 align-items:center;gap:25px;
 padding:10px;flex-wrap:wrap;
}
.pad{
 display:grid;
 grid-template-columns:55px 55px 55px;
 grid-template-rows:48px 48px 48px;
 gap:4px;
}
button{
 border:0;border-radius:12px;
 padding:12px;font-weight:bold;
 cursor:pointer;touch-action:none;
}
.pad button{background:#6555aa;color:white;font-size:21px}
.pad span{visibility:hidden}
.action{background:#ffe477;color:#392500}
#market{
 background:linear-gradient(135deg,#ffbd59,#ed7c38);
 color:#402414;width:95%;max-width:900px;
 margin:12px auto;padding:16px;
 border:4px solid #ffe5a3;border-radius:18px;
}
#market h2{margin:5px}
#reset{background:#a9d9ff;color:#17234b}
small{color:#dedcf8}
</style>
</head>
<body>

<h1>😭 AĞLAYAN RAKUN & AĞLAYAN NÖR 😭</h1>

<div id="hud">
 <div class="info">🏃 Hız: %150</div>
 <div class="info">🪵 Sopa: <span id="inventory">Yok</span></div>
 <div class="info">🎯 Yakalanan: <span id="caught">0/2</span></div>
</div>

<div id="game">
<canvas id="canvas" width="900" height="520"></canvas>
</div>

<div id="message">
 Market Amca: Hoş geldiniz! Size bedava bir sopa vereyim!
</div>

<div id="controls">
 <div class="pad">
  <span></span>
  <button data-dir="up">⬆️</button>
  <span></span>
  <button data-dir="left">⬅️</button>
  <button data-dir="down">⬇️</button>
  <button data-dir="right">➡️</button>
 </div>
 <button class="action" id="interact">E - ETKİLEŞİM</button>
</div>

<div id="market">
 <h2>🏪 MARKET AMCA</h2>
 <p>🧔 Amca: Hoş geldiniz! Size bedava bir sopa vereyim!</p>
 <div style="font-size:32px" id="stick">🪵</div>
 <button class="action" id="get">🎁 Bedava sopayı al</button>
 <p><small>Önce amcadan sopanı al, sonra Rakun ve Nör'ü yakala!</small></p>
</div>

<button id="reset" onclick="location.reload()">🔄 Oyunu yeniden başlat</button>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const W=900,H=520;
const message=document.getElementById("message");

let hasStick=false;
let caughtCount=0;
let gameWon=false;
let keys={};
let touch={up:false,down:false,left:false,right:false};
let time=0;

const player={
 x:450,y:390,
 speed:105,
 color:"#e15c75",
 name:"Sen"
};

const npcs=[
 {
  name:"Ağlayan Rakun",
  x:230,y:190,
  speed:70,
  color:"#e15c75",
  hair:"#35221d",
  caught:false,
  phase:0
 },
 {
  name:"Ağlayan Nör",
  x:650,y:180,
  speed:70,
  color:"#7565dc",
  hair:"#17152d",
  caught:false,
  phase:2
 }
];

const uncle={x:790,y:370};

function say(t){
 message.textContent=t;
}

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

// PARK ÇİZİMİ
function drawPark(){
 ctx.fillStyle="#e8c58d";
 ctx.fillRect(0,0,W,H);

 // Kum taneleri
 for(let i=0;i<180;i++){
  let x=(i*137)%W;
  let y=(i*83)%H;
  ctx.fillStyle=i%2?"#d4ad72":"#f2d9a6";
  ctx.beginPath();
  ctx.arc(x,y,2,0,Math.PI*2);
  ctx.fill();
 }

 // Park yolu
 ctx.fillStyle="#d2ad7a";
 ctx.fillRect(0,300,W,90);

 // Ağaçlar
 drawTree(75,110);
 drawTree(820,105);
 drawTree(100,445);
 drawTree(700,455);

 // Çalılar
 drawBush(350,95);
 drawBush(550,455);
 drawBush(410,245);

 // Bank
 ctx.fillStyle="#76502e";
 ctx.fillRect(330,145,100,12);
 ctx.fillRect(330,165,100,10);
 ctx.fillStyle="#51351f";
 ctx.fillRect(340,155,8,28);
 ctx.fillRect(415,155,8,28);

 // Park lambası
 ctx.fillStyle="#44404c";
 ctx.fillRect(480,75,8,100);
 ctx.fillStyle="#ffe477";
 ctx.beginPath();
 ctx.arc(484,70,15,0,Math.PI*2);
 ctx.fill();

 // Park tabelası
 ctx.fillStyle="#75502f";
 ctx.fillRect(40,20,7,65);
 ctx.fillStyle="#3e8951";
 ctx.fillRect(10,20,100,38);
 ctx.fillStyle="white";
 ctx.font="bold 17px Arial";
 ctx.fillText("ŞEHİR PARKI",15,45);
}

function drawTree(x,y){
 ctx.fillStyle="#76502e";
 ctx.fillRect(x-8,y,16,65);
 ctx.fillStyle="#378a45";
 ctx.beginPath();
 ctx.arc(x,y-5,37,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#54a84c";
 ctx.beginPath();
 ctx.arc(x-18,y-17,20,0,Math.PI*2);
 ctx.fill();
}

function drawBush(x,y){
 ctx.fillStyle="#398b48";
 ctx.beginPath();
 ctx.arc(x,y,22,0,Math.PI*2);
 ctx.arc(x+18,y+5,18,0,Math.PI*2);
 ctx.arc(x-18,y+5,18,0,Math.PI*2);
 ctx.fill();
}

// MARKET AMCA
function drawUncle(){
 // Tezgah
 ctx.fillStyle="#a94c3c";
 ctx.fillRect(710,300,175,95);
 ctx.fillStyle="#ffcf73";
 ctx.fillRect(710,285,175,23);

 ctx.fillStyle="#e45e4d";
 for(let i=0;i<5;i++){
  ctx.fillRect(710+i*35,285,17,23);
 }

 ctx.fillStyle="#fff3cb";
 ctx.font="bold 18px Arial";
 ctx.fillText("MARKET AMCA",720,330);

 ctx.fillStyle="#9a633e";
 ctx.fillRect(720,345,155,50);

 // Amca
 drawHuman(790,255,{
  color:"#416caa",
  hair:"#4a3023",
  name:"Market Amca",
  crying:false,
  size:0.85
 });
}

// İNSAN KARAKTERLERİ
function drawHuman(x,y,o){
 const s=o.size||1;

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(s,s);

 // Gölge
 ctx.fillStyle="#0003";
 ctx.beginPath();
 ctx.ellipse(0,0,22,8,0,0,Math.PI*2);
 ctx.fill();

 // Bacaklar
 ctx.fillStyle="#30334c";
 ctx.fillRect(-14,-35,11,35);
 ctx.fillRect(4,-35,11,35);

 // Gövde
 ctx.fillStyle=o.color;
 ctx.fillRect(-21,-85,42,52);

 // Kollar
 ctx.fillStyle=o.color;
 ctx.fillRect(-30,-80,10,40);
 ctx.fillRect(20,-80,10,40);

 // Kafa
 ctx.fillStyle="#efbd96";
 ctx.beginPath();
 ctx.ellipse(0,-105,23,29,0,0,Math.PI*2);
 ctx.fill();

 // Saç
 ctx.fillStyle=o.hair;
 ctx.beginPath();
 ctx.arc(0,-120,24,Math.PI,Math.PI*2);
 ctx.fill();
 ctx.fillRect(-23,-120,46,9);

 // Gözler
 ctx.fillStyle="#211d26";
 ctx.beginPath();
 ctx.arc(-8,-108,3,0,Math.PI*2);
 ctx.arc(8,-108,3,0,Math.PI*2);
 ctx.fill();

 // Ağız
 ctx.strokeStyle="#753c3c";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,-94,6,Math.PI,Math.PI*2);
 ctx.stroke();

 // Gözyaşları
 if(o.crying){
  ctx.fillStyle="#20baff";
  ctx.beginPath();
  ctx.ellipse(-10,-96+(Math.sin(time*9)*4),3,8,0,0,Math.PI*2);
  ctx.ellipse(10,-96+(Math.sin(time*9+1)*4),3,8,0,0,Math.PI*2);
  ctx.fill();
 }

 // İsim
 ctx.fillStyle="white";
 ctx.font="bold 13px Arial";
 ctx.textAlign="center";
 ctx.shadowColor="#333";
 ctx.shadowBlur=4;
 ctx.fillText(o.name,0,-150);
 ctx.shadowBlur=0;

 ctx.restore();
}

function drawPlayer(){
 drawHuman(player.x,player.y,{
  color:"#287cc4",
  hair:"#302019",
  name:"SEN",
  crying:false
 });

 if(hasStick){
  ctx.font="25px Arial";
  ctx.fillText("🪵",player.x+22,player.y-65);
 }
}

function drawNPCs(){
 npcs.forEach(n=>{
  if(!n.caught){
   drawHuman(n.x,n.y,{
    color:n.color,
    hair:n.hair,
    name:n.name,
    crying:true
   });
  }else{
   drawHuman(n.x,n.y,{
    color:n.color,
    hair:n.hair,
    name:n.name+" 😊",
    crying:true
   });
  }
 });
}

function render(){
 ctx.clearRect(0,0,W,H);
 drawPark();
 drawUncle();
 drawNPCs();
 drawPlayer();

 if(gameWon){
  ctx.fillStyle="#38234e";
  ctx.fillRect(190,200,520,100);
  ctx.fillStyle="#ffe477";
  ctx.font="bold 29px Arial";
  ctx.textAlign="center";
  ctx.fillText("🎉 İKİSİNİ DE YAKALADIN!",450,260);
 }
}

// KONTROLLER
function updatePlayer(dt){
 let dx=0,dy=0;

 if(keys["w"]||keys["arrowup"]||touch.up)dy--;
 if(keys["s"]||keys["arrowdown"]||touch.down)dy++;
 if(keys["a"]||keys["arrowleft"]||touch.left)dx--;
 if(keys["d"]||keys["arrowright"]||touch.right)dx++;

 if(dx&&dy){
  dx*=0.7071;
  dy*=0.7071;
 }

 player.x+=dx*player.speed*dt;
 player.y+=dy*player.speed*dt;

 player.x=Math.max(25,Math.min(W-25,player.x));
 player.y=Math.max(190,Math.min(H-15,player.y));
}

// RAKUN VE NÖR KAÇIYOR
function updateNPCs(dt){
 npcs.forEach(n=>{
  if(n.caught)return;

  let dx=n.x-player.x;
  let dy=n.y-player.y;
  let d=Math.hypot(dx,dy)||1;

  // Oyuncudan kaçış
  if(d<260){
   n.x+=(dx/d)*n.speed*dt;
   n.y+=(dy/d)*n.speed*dt;
  }else{
   // Uzakta gezinme
   n.phase+=dt;
   n.x+=Math.sin(n.phase)*n.speed*0.35*dt;
   n.y+=Math.cos(n.phase*0.8)*n.speed*0.35*dt;
  }

  n.x=Math.max(35,Math.min(W-35,n.x));
  n.y=Math.max(185,Math.min(H-20,n.y));

  // Yakalama
  if(distance(player,n)<34){
   if(hasStick){
    n.caught=true;
    caughtCount++;

    document.getElementById("caught").textContent=caughtCount+"/2";

    say(n.name+": YouTuber abi, özür dilerim! 😭");

    if(caughtCount===2){
     gameWon=true;
     say("🎉 İkisini de yakaladın! Ağlayan Rakun ve Ağlayan Nör: YouTuber abi, özür dileriz!");
    }
   }else{
    say("Önce Market Amca'dan bedava sopayı almalısın!");
   }
  }
 });
}

// AMCA İLE ETKİLEŞİM
function getStick(){
 hasStick=true;
 document.getElementById("inventory").textContent="Var 🪵";
 document.getElementById("stick").textContent="🪵 ✅";
 say("Market Amca: Sopayı bedava verdim! Şimdi Ağlayan Rakun ve Ağlayan Nör'ü yakalayabilirsin!");
}

document.getElementById("get").onclick=getStick;

function interact(){
 if(distance(player,uncle)<115){
  say("Market Amca: Evlatlar, neden ağlıyorsunuz? Size bedava bir sopa verdim!");
  return;
 }

 if(!hasStick){
  say("Önce market amcadan bedava sopayı almalısın!");
  return;
 }

 for(const n of npcs){
  if(!n.caught && distance(player,n)<75){
   say(n.name+": YouTuber abi, özür dilerim!");
   return;
  }
 }

 say("Biraz daha yaklaşmalısın! Rakun ve Nör kaçıyor! 😂");
}

document.getElementById("interact").onclick=interact;

document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)){
  e.preventDefault();
 }
 keys[k]=true;
 if(k==="e")interact();
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

// TELEFON KONTROLLERİ
document.querySelectorAll("[data-dir]").forEach(btn=>{
 const dir=btn.dataset.dir;

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  touch[dir]=true;
 });

 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  btn.addEventListener(ev,()=>{
   touch[dir]=false;
  });
 });
});

let last=0;

function loop(timestamp){
 const dt=Math.min((timestamp-last)/1000||0,0.04);
 last=timestamp;
 time+=dt;

 updatePlayer(dt);
 updateNPCs(dt);
 render();

 requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
